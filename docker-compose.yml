# Servicios de desarrollo local.
# Arrancar:  docker compose up -d
# Parar:     docker compose down        (los datos se conservan en el volumen)
# Borrar BD: docker compose down -v     (¡elimina también los datos!)

services:
  db:
    image: postgres:17-alpine
    container_name: suite-flotas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suite_dev}
      POSTGRES_DB: ${POSTGRES_DB:-suite_flotas}
      TZ: Europe/Madrid
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
